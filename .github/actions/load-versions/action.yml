name: load-versions
description: >
  Loads values from the repo-root `versions.yaml` into environment variables
  for the current job (via `$GITHUB_ENV`). Downstream steps consume via
  `${{ env.X_* }}`. Requires `actions/checkout` to have run first.

  Environment variables set:
    X_PYTHON_MIN_VERSION       (python.min)
    X_PYTHON_MAX_VERSION       (python.max)
    X_MYPY_VERSION             (tools.mypy)
    X_RUFF_VERSION             (tools.ruff)
    X_API_VERSION              (spec.api_version)
    X_AAS_SPECS_RELEASE_TAG    (spec.aas)

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        {
          echo "X_PYTHON_MIN_VERSION=$(yq '.python.min' versions.yaml)"
          echo "X_PYTHON_MAX_VERSION=$(yq '.python.max' versions.yaml)"
          echo "X_MYPY_VERSION=$(yq '.tools.mypy' versions.yaml)"
          echo "X_RUFF_VERSION=$(yq '.tools.ruff' versions.yaml)"
          echo "X_API_VERSION=$(yq '.spec.api_version' versions.yaml)"
          echo "X_AAS_SPECS_RELEASE_TAG=$(yq '.spec.aas' versions.yaml)"
        } >> "$GITHUB_ENV"
