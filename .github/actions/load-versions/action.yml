name: load-versions
description: >
  Loads values from the repo-root versions.yaml into environment variables
  for the current job (via GITHUB_ENV). Downstream steps consume the values
  through the usual env context. Requires actions/checkout to have run first.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        {
          echo "X_PYTHON_MIN_VERSION=$(yq '.python.min' versions.yaml)"
          echo "X_PYTHON_MAX_VERSION=$(yq '.python.max' versions.yaml)"
          echo "X_MYPY_VERSION=$(yq '.dev_tools.mypy' versions.yaml)"
          echo "X_RUFF_VERSION=$(yq '.dev_tools.ruff' versions.yaml)"
          echo "X_API_VERSION=$(yq '.spec.api_version' versions.yaml)"
          echo "X_AAS_SPECS_RELEASE_TAG=$(yq '.spec.aas' versions.yaml)"
        } >> "$GITHUB_ENV"
