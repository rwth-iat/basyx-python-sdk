name: secured-basyx-stack

services:
  envoy:
    image: envoyproxy/envoy:v1.31.10
    command:
      - envoy
      - -c
      - /etc/envoy/envoy.yaml
      - --log-level
      - info
      - --component-log-level
      - jwt:debug,ext_authz:debug
    ports:
      - "10000:10000"
      # Envoy admin interface: no authentication, so only reachable from this machine.
      - "127.0.0.1:8001:8001"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - repository
      - registry
      - discovery
      - aas-web-ui
      - keycloak
      - opa-envoy

  # The BaSyx servers run as the published, unmodified images: the access control layer
  # must not depend on building the servers from this repository.
  repository:
    image: eclipsebasyx/basyx-python-repository:2.2.0
    volumes:
      - ./example_data:/input:ro
      - repository-storage:/storage
    environment:
      API_BASE_PATH: /repository/api/v3.1/
      STORAGE_PERSISTENCY: "True"

  registry:
    image: eclipsebasyx/basyx-python-registry:2.2.0
    volumes:
      - registry-storage:/storage
    environment:
      API_BASE_PATH: /registry/api/v3.1/
      STORAGE_PERSISTENCY: "True"

  discovery:
    image: eclipsebasyx/basyx-python-discovery:2.2.0
    environment:
      API_BASE_PATH: /discovery/api/v3.1/

  aas-web-ui:
    image: eclipsebasyx/aas-gui:v2-261013
    restart: unless-stopped
    environment:
      BASE_PATH: /ui
      ENDPOINT_CONFIG_AVAILABLE: "false"
      ALLOW_EDITING: "true"
      ALLOW_UPLOADING: "true"
    volumes:
      - ./basyx-infra.yml:/basyx-infra.yml:ro

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.4
    command:
      - start-dev
      - --import-realm
      - --hostname=http://localhost:8080
      - --hostname-strict=false
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro

  opa-envoy:
    # The "-envoy-static" variant is published for amd64 and arm64 (Apple Silicon);
    # "-envoy" is amd64 only.
    image: openpolicyagent/opa:1.21.2-envoy-static
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --diagnostic-addr=0.0.0.0:9901
      - --log-level=info
      - --config-file=/config/opa.yaml
      - /policies
    # No published ports: Envoy reaches OPA over the internal network. The OPA REST API
    # has no authentication and would allow reading and replacing the policy.
    volumes:
      - ./opa.yaml:/config/opa.yaml:ro
      - ./policies:/policies:ro

# Server data lives in Docker volumes instead of folders in the repository.
# Remove them with `docker compose down -v`.
volumes:
  repository-storage:
  registry-storage:
